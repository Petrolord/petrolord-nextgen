name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint --if-present

    # The vendored engines are a hand-maintained copy of the canonical
    # petrolord-engines tree. Nothing used to compare the two, so a partial
    # pull built cleanly and looked successful: by 2026-09-16 the tree was
    # short 191 canonical paths and differed in 126 more. These two steps are
    # the check that stops it. They run BEFORE the build, because a build that
    # succeeds on a diverged tree is exactly the signal that hid this.
    - name: Vendored engines match canonical
      run: node tools/check-vendored-engines.mjs

    - name: Vendored engine suites
      run: |
        npm ci --prefix packages/engines
        node tools/run-vendored-engine-tests.mjs

    - name: Build
      run: npm run build

  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest