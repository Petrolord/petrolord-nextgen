name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint --if-present

    # The vendored engines are a hand-maintained copy of the canonical
    # petrolord-engines tree. Nothing used to compare the two, so a partial
    # pull built cleanly and looked successful: by 2026-09-16 the tree was
    # short 191 canonical paths and differed in 126 more. These two steps are
    # the check that stops it. They run BEFORE the build, because a build that
    # succeeds on a diverged tree is exactly the signal that hid this.
    - name: Vendored engines match canonical
      run: node tools/check-vendored-engines.mjs

    - name: Vendored engine suites
      run: |
        npm ci --prefix packages/engines
        node tools/run-vendored-engine-tests.mjs

    # THE COURSE GATES. Every shipped course pins its lab against the teaching
    # digest its 78 lessons were written from, and keeps the graded capstone
    # answers out of everything a learner can see. Until 2026-09-16 not one of
    # those suites had ever run here. There was no vitest step at all, and the
    # suites could not have run if there had been: each read its inputs from an
    # absolute path under /root, the wave directory its author built in. So
    # "CI green" on a course pull request meant lint, the vendored engine
    # suites and a build, and never a single course gate.
    #
    # The inputs are committed under tools/course-waves now. The first step
    # checks that committed copy against the wave's own generators, because a
    # stale copy would keep every gate green while pinning numbers nothing
    # produces. The second runs the gates.
    - name: Committed wave inputs
      run: node tools/course-waves/check-wave-inputs.mjs

    # A bank ships as a PAIR: the .py that builds the questions and the .json
    # it writes, which is what the seed migrations carry. Repair a question in
    # the JSON alone and everything downstream is correct while the next re-cut
    # reverts the repair in silence. FC2 shipped with ten of its twenty one
    # sources in that state, twenty four questions, three of them keyed
    # answers, and nothing here said so. This runs every committed source and
    # compares the bytes it writes with the bytes committed beside it.
    - name: Committed bank sources reproduce their JSON
      run: |
        python3 tools/course-banks/check-bank-sources.py --selftest
        python3 tools/course-banks/check-bank-sources.py

    - name: Course panel and lab gates
      run: npx vitest run src/components/course/panels --reporter=basic

    - name: Build
      run: npm run build

  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lowercase the image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.name }}:latest